services:
  cfx-server:
    image: ghcr.io/itsmeares/cfx-server-docker:106-ea
    build: .
    restart: unless-stopped
    stdin_open: true
    tty: true

    depends_on:
      mariadb:
        condition: service_healthy

    security_opt:
      - seccomp=./seccomp.json

    environment:
      TXHOST_DATA_PATH: /txData
      TXHOST_GAME_NAME: fivem
      TXHOST_TXA_PORT: "40120"
      TXHOST_FXS_PORT: "30120"
      TXHOST_INTERFACE: 0.0.0.0

    volumes:
      - ./txData:/txData

    ports:
      - "30120:30120/tcp"
      - "30120:30120/udp"
      - "40120:40120/tcp"

  mariadb:
    image: mariadb:12.3.2
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-qbox}"
      MARIADB_USER: "${MARIADB_USER:-qbox}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}"

    volumes:
      - ./mariadb:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  dbgate:
    image: dbgate/dbgate:7.2.3-alpine
    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      LOGIN: "${DBGATE_LOGIN:-admin}"
      PASSWORD: "${DBGATE_PASSWORD:?Set DBGATE_PASSWORD in .env}"
      CONNECTIONS: qbox
      LABEL_qbox: QBox MariaDB
      SERVER_qbox: mariadb
      USER_qbox: "${MARIADB_USER:-qbox}"
      PASSWORD_MODE_qbox: askPassword
      PORT_qbox: "3306"
      DATABASE_qbox: "${MARIADB_DATABASE:-qbox}"
      ENGINE_qbox: mariadb@dbgate-plugin-mysql
      SINGLE_CONNECTION: qbox
      SINGLE_DATABASE: "${MARIADB_DATABASE:-qbox}"
      LANGUAGE: en

    volumes:
      - ./dbgate:/root/.dbgate

    ports:
      - "${DBGATE_BIND_ADDRESS:-127.0.0.1}:${DBGATE_PORT:-3002}:3000"
