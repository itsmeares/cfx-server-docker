name: Publish image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Read Cfx Server build
        id: cfx
        shell: bash
        run: |
          set -euo pipefail
          build=$(sed -nE 's/.*cfx-server-docker:([0-9]+)-ea.*/\1/p' compose.yaml)
          [[ "$build" =~ ^[0-9]+$ ]]
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/itsmeares/cfx-server-docker:${{ steps.cfx.outputs.build }}-ea
            ghcr.io/itsmeares/cfx-server-docker:latest
