name: cfx-server-docker

services:
  cfx-server:
    image: ghcr.io/itsmeares/cfx-server-docker:106-ea
    container_name: cfx-server-enhanced
    hostname: cfx-server-enhanced
    restart: unless-stopped
    stdin_open: true
    tty: true

    depends_on:
      mariadb:
        condition: service_healthy

    security_opt:
      - seccomp=/DATA/AppData/cfx-server-docker/seccomp.json

    environment:
      TXHOST_DATA_PATH: /txData
      TXHOST_GAME_NAME: fivem
      TXHOST_TXA_PORT: "40120"
      TXHOST_FXS_PORT: "30120"
      TXHOST_INTERFACE: 0.0.0.0

    volumes:
      - /DATA/AppData/cfx-server-docker/txData:/txData

    ports:
      - "30120:30120/tcp"
      - "30120:30120/udp"
      - "40120:40120/tcp"

  mariadb:
    image: mariadb:12.3.2
    container_name: cfx-server-mariadb
    hostname: mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_ROOT_PASSWORD
      MARIADB_DATABASE: qbox
      MARIADB_USER: qbox
      MARIADB_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_DATABASE_PASSWORD

    volumes:
      - /DATA/AppData/cfx-server-docker/mariadb:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  dbgate:
    image: dbgate/dbgate:7.2.3-alpine
    container_name: cfx-server-dbgate
    hostname: dbgate
    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      LOGIN: admin
      PASSWORD: REPLACE_WITH_A_LONG_RANDOM_DBGATE_PASSWORD
      CONNECTIONS: qbox
      LABEL_qbox: QBox MariaDB
      SERVER_qbox: mariadb
      USER_qbox: qbox
      PASSWORD_MODE_qbox: askPassword
      PORT_qbox: "3306"
      DATABASE_qbox: qbox
      ENGINE_qbox: mariadb@dbgate-plugin-mysql
      SINGLE_CONNECTION: qbox
      SINGLE_DATABASE: qbox
      LANGUAGE: en

    volumes:
      - /DATA/AppData/cfx-server-docker/dbgate:/root/.dbgate

    ports:
      - "3002:3000/tcp"

x-casaos:
  architectures:
    - amd64
  main: cfx-server
  store_app_id: cfx-server-docker
  category: Games
  author: itsmeares
  developer: Cfx.re
  icon: https://avatars.githubusercontent.com/u/25160833?s=200&v=4
  title:
    en_us: Cfx Server Enhanced
  tagline:
    en_us: FiveM server for GTAV Enhanced
  description:
    en_us: Experimental Cfx Server build for FiveM GTAV Enhanced with txAdmin, MariaDB, and DbGate.
  port_map: "40120"
  scheme: http
  index: /
